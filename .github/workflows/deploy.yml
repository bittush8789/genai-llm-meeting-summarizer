name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - cicd
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      # Add unit tests run step if tests exist (fallback if no tests present)
      - name: Run Tests
        run: |
          echo "Running backend test suite..."
          # python -m pytest (uncomment when tests are added)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/genai-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/genai-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/genai-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/genai-frontend:${{ github.sha }}

  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cicd'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

      - name: Update Secret Keys
        run: |
          # Dynamically set GROQ API Key in Secret manifest from GitHub Actions Secrets
          sed -i "s|Z3NrX3lvdXJfZ3JvcV9hcGlfa2V5X2hlcmU=|$(echo -n '${{ secrets.GROQ_API_KEY }}' | base64)|g" kubernetes/secrets.yaml

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/configmap.yaml
          kubectl apply -f kubernetes/secrets.yaml
          kubectl apply -f kubernetes/mysql-pvc.yaml
          kubectl apply -f kubernetes/mysql-deployment.yaml
          kubectl apply -f kubernetes/mysql-service.yaml
          kubectl apply -f kubernetes/chromadb-pvc.yaml
          kubectl apply -f kubernetes/chromadb-deployment.yaml
          kubectl apply -f kubernetes/chromadb-service.yaml
          
          # Use Dockerhub images instead of local tag in deployment spec for Kube cluster
          sed -i "s|genai-backend:latest|${{ secrets.DOCKER_USERNAME }}/genai-backend:latest|g" kubernetes/backend-deployment.yaml
          sed -i "s|genai-frontend:latest|${{ secrets.DOCKER_USERNAME }}/genai-frontend:latest|g" kubernetes/frontend-deployment.yaml
          
          kubectl apply -f kubernetes/backend-deployment.yaml
          kubectl apply -f kubernetes/backend-service.yaml
          kubectl apply -f kubernetes/frontend-deployment.yaml
          kubectl apply -f kubernetes/frontend-service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/mysql -n meeting-summarizer --timeout=120s
          kubectl rollout status deployment/chromadb -n meeting-summarizer --timeout=120s
          kubectl rollout status deployment/backend -n meeting-summarizer --timeout=180s
          kubectl rollout status deployment/frontend -n meeting-summarizer --timeout=120s
