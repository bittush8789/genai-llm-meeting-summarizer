apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: meeting-summarizer
  labels:
    app: chromadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:0.4.24
          ports:
            - containerPort: 8000
              name: chromadb
          volumeMounts:
            - name: chromadb-storage
              mountPath: /chroma/chroma
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSISTENT_DIRECTORY
              value: "/chroma/chroma"
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "512Mi"
      volumes:
        - name: chromadb-storage
          persistentVolumeClaim:
            claimName: chromadb-pvc
