apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: meeting-summarizer
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: genai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: summarizer-config
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: summarizer-secrets
                  key: GROQ_API_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: summarizer-secrets
                  key: MYSQL_PASSWORD
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
