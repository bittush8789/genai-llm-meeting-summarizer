version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: summarizer-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: meeting_summarizer
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: summarizer-chromadb
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTENT_DIRECTORY=/chroma/chroma
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: summarizer-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=gsk_your_groq_api_key_here
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root_password_here
      - DB_NAME=meeting_summarizer
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: summarizer-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql-data:
  chroma-data:
  backend-uploads:

networks:
  app-network:
    driver: bridge
